name: Android CI

on:
  push:
    branches:
      - main
      - feat/basic-pos-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_release:
        description: Build signed release AAB (requires android-release Environment secrets)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install pinned Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4.4.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Bootstrap Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.6.0 --distribution-type bin

      - name: Seed dependency verification metadata and run quality gates
        run: ./gradlew --no-daemon --write-verification-metadata sha256 testDebugUnitTest lintDebug assembleDebug

      - name: Verify resolved dependencies and repeat quality gates
        run: ./gradlew --no-daemon --dependency-verification=strict testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: berkah-pos-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
            app/schemas/
            gradle/verification-metadata.xml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Signed release AAB
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install pinned Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4.4.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Bootstrap Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.6.0 --distribution-type bin

      - name: Configure upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" || { echo "Missing upload keystore secret"; exit 1; }
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/berkah-upload.jks"
          test -s "$RUNNER_TEMP/berkah-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/berkah-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and seed verification metadata
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          ./gradlew --no-daemon --write-verification-metadata sha256 bundleRelease
          ./gradlew --no-daemon --dependency-verification=strict bundleRelease

      - name: Validate bundle and signature
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          curl --fail --silent --show-error --location \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/signature-check.txt"
          grep -q "jar verified." "$RUNNER_TEMP/signature-check.txt"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/upload-certificate.txt"
          sha256sum "$AAB" > SHA256SUMS

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          cat > release-metadata.json <<EOF
          {
            "applicationId": "id.berkahtigaputeri.basicpos",
            "versionName": "0.1.0",
            "versionCode": 1,
            "targetSdk": 36,
            "minSdk": 24,
            "commit": "$GITHUB_SHA",
            "workflowRun": "$GITHUB_RUN_ID"
          }
          EOF
          mkdir -p android-release
          cp app/build/outputs/bundle/release/app-release.aab android-release/berkah-pos-release.aab
          cp SHA256SUMS release-metadata.json android-release/
          cp "$RUNNER_TEMP/signature-check.txt" android-release/
          cp "$RUNNER_TEMP/upload-certificate.txt" android-release/
          cp -R app/build/reports android-release/ 2>/dev/null || true
          cp -R app/build/test-results android-release/ 2>/dev/null || true
          cp docs/PLAY_STORE_CHECKLIST.md android-release/

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: berkah-pos-release-${{ github.run_number }}
          path: android-release/
          if-no-files-found: error
          retention-days: 90
