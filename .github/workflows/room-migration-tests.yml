name: POS and Room Instrumentation Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/src/main/java/id/berkahtigaputeri/basicpos/data/local/**"
      - "app/src/main/java/id/berkahtigaputeri/basicpos/data/repository/**"
      - "app/src/main/java/id/berkahtigaputeri/basicpos/domain/model/**"
      - "app/src/main/java/id/berkahtigaputeri/basicpos/domain/repository/**"
      - "app/src/main/java/id/berkahtigaputeri/basicpos/navigation/**"
      - "app/src/main/java/id/berkahtigaputeri/basicpos/ui/**"
      - "app/src/main/java/id/berkahtigaputeri/basicpos/BerkahPosApplication.kt"
      - "app/src/main/java/id/berkahtigaputeri/basicpos/data/preferences/**"
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/room-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  room-migration:
    name: POS checkout and Room v1 to v2 instrumentation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 15859902
          packages: "platform-tools build-tools;36.0.0"

      - name: Install compile platform and API 36 emulator image
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "platforms;android-37.1" \
            "system-images;android-36;google_apis;x86_64" \
            "build-tools;36.0.0" --channel=0
          test -s "$ANDROID_SDK_ROOT/platforms/android-37.1/android.jar"
          test -s "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/emulator/emulator"
          command -v avdmanager
          command -v adb

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.7.0"
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Bootstrap verified Gradle wrapper
        run: |
          set -euo pipefail
          BOOTSTRAP_DIR="$RUNNER_TEMP/wrapper-bootstrap"
          mkdir -p "$BOOTSTRAP_DIR"
          : > "$BOOTSTRAP_DIR/settings.gradle"
          : > "$BOOTSTRAP_DIR/build.gradle"
          (
            cd "$BOOTSTRAP_DIR"
            gradle --no-daemon wrapper --gradle-version 9.7.0 --distribution-type bin \
              --gradle-distribution-sha256-sum 84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae
          )
          install -D "$BOOTSTRAP_DIR/gradlew" "$GITHUB_WORKSPACE/gradlew"
          install -D "$BOOTSTRAP_DIR/gradlew.bat" "$GITHUB_WORKSPACE/gradlew.bat"
          install -D "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.jar" "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"
          install -D "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.properties"
          chmod +x gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --status

      - name: Grant hosted runner access to KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm || {
            echo "This runner does not expose the KVM device required by the x86_64 Android emulator."
            exit 1
          }
          RUNNER_USER="$(id -un)"
          if command -v setfacl >/dev/null 2>&1; then
            sudo setfacl -m "u:${RUNNER_USER}:rw" /dev/kvm
          else
            sudo chown "${RUNNER_USER}" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Create API 36 Android Virtual Device
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd --force \
            --name berkah-pos-api-36 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_7_pro \
            --sdcard 2G
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx "berkah-pos-api-36"

      - name: Boot API 36 emulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          EMULATOR_LOG="$RUNNER_TEMP/berkah-pos-emulator.log"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd berkah-pos-api-36 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -no-metrics \
            -wipe-data \
            -accel auto > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$RUNNER_TEMP/berkah-pos-emulator.pid"

          adb start-server
          timeout 120s adb wait-for-device

          DEADLINE=$((SECONDS + 600))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat "$EMULATOR_LOG"
              echo "Android emulator exited before boot completed."
              exit 1
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              cat "$EMULATOR_LOG"
              echo "Android emulator did not finish booting within 10 minutes."
              exit 1
            fi
            sleep 5
          done

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc power stayon true
          adb shell getprop ro.build.version.sdk
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\\r')" = "36"

      - name: Run POS checkout and Room migration instrumentation tests
        run: ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace --console=plain

      - name: Capture emulator diagnostics on failure
        if: failure()
        timeout-minutes: 1
        run: |
          set +e
          if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
            timeout 15s adb logcat -d -t 3000 > "$RUNNER_TEMP/berkah-pos-emulator-logcat.txt" 2>&1
          fi
          if [ -f "$RUNNER_TEMP/berkah-pos-emulator.log" ]; then
            tail -n 300 "$RUNNER_TEMP/berkah-pos-emulator.log" > "$RUNNER_TEMP/berkah-pos-emulator-startup.txt"
          fi

      - name: Upload Room migration test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: berkah-pos-room-migration-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/test-results/
            app/build/outputs/apk/androidTest/debug/
            app/build/outputs/apk/debug/
            ${{ runner.temp }}/berkah-pos-emulator-logcat.txt
            ${{ runner.temp }}/berkah-pos-emulator-startup.txt
          if-no-files-found: warn
          retention-days: 30
